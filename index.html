<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>แชร์ Flex Message</title>
    <!-- โหลดระบบของ LIFF -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f5f5f5; }
        button { padding: 15px 30px; font-size: 18px; color: white; background-color: #00B900; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <button onclick="sendFlex()">เลือกกลุ่มเพื่อส่งการ์ด</button>

    <script>
        // 1. นำ LIFF ID ของคุณมาใส่ตรงนี้
        liff.init({ liffId: "2011731844-JYR6nO5L" });

        async function sendFlex() {
            if (!liff.isLoggedIn()) {
                liff.login();
            } else {
                // 2. โครงสร้างข้อความแบบ Flex
                const flexMessage = {
                    "type": "flex",
                    "altText": "มีการ์ดแอปพลิเคชันส่งถึงคุณ",
                    "contents": {
                        // --- โครงสร้างการ์ด Flex Message ---
                        "type": "bubble",
                        "action": {
                            "type": "uri",
                            "label": "เปิดเว็บ",
                            "uri": "https://aicip-p3-app.onrender.com/"
                        },
                        "body": {
                            "type": "box",
                            "layout": "vertical",
                            "contents": [
                                {
                                    "type": "box",
                                    "layout": "horizontal",
                                    "contents": [
                                        {
                                            "type": "image",
                                            "url": "https://i.postimg.cc/nLMjg9HY/krat-nha-Lead-l-kkh-a-(10)-01.png",
                                            "size": "full",
                                            "aspectMode": "cover",
                                            "aspectRatio": "150:196",
                                            "gravity": "center",
                                            "flex": 1,
                                            "margin": "none"
                                        },
                                        {
                                            "type": "box",
                                            "layout": "vertical",
                                            "contents": [
                                                {
                                                    "type": "image",
                                                    "url": "https://i.postimg.cc/7htGNB2W/CIP1-(1).png",
                                                    "size": "full",
                                                    "aspectMode": "cover",
                                                    "aspectRatio": "150:98",
                                                    "gravity": "center"
                                                },
                                                {
                                                    "type": "image",
                                                    "url": "https://i.postimg.cc/XqYBdMpk/CIP1.png",
                                                    "size": "full",
                                                    "aspectMode": "cover",
                                                    "aspectRatio": "150:98",
                                                    "gravity": "center"
                                                }
                                            ],
                                            "flex": 1
                                        }
                                    ]
                                },
                                {
                                    "type": "box",
                                    "layout": "horizontal",
                                    "contents": [
                                        {
                                            "type": "box",
                                            "layout": "vertical",
                                            "contents": [
                                                {
                                                    "type": "image",
                                                    "url": "https://i.postimg.cc/cLySB6CM/logo-post2.png",
                                                    "aspectMode": "cover",
                                                    "size": "full",
                                                    "margin": "xxl"
                                                }
                                            ],
                                            "cornerRadius": "100px",
                                            "width": "72px",
                                            "height": "72px"
                                        },
                                        {
                                            "type": "box",
                                            "layout": "vertical",
                                            "contents": [
                                                {
                                                    "type": "text",
                                                    "contents": [
                                                        {
                                                            "type": "span",
                                                            "text": "ระบบปฏิบัติการ AICIPReg03-ปข.3 (ตล.)",
                                                            "weight": "bold",
                                                            "color": "#000000"
                                                        },
                                                        {
                                                            "type": "span",
                                                            "text": "     "
                                                        },
                                                        {
                                                            "type": "span",
                                                            "text": "Dowload ใช้งานได้ตามปกติ"
                                                        }
                                                    ],
                                                    "size": "sm",
                                                    "wrap": true
                                                },
                                                {
                                                    "type": "box",
                                                    "layout": "baseline",
                                                    "contents": [
                                                        {
                                                            "type": "text",
                                                            "text": "พัฒนาระบบโดย ปข.3 (ตล.)",
                                                            "size": "sm",
                                                            "color": "#bcbcbc"
                                                        }
                                                    ],
                                                    "spacing": "sm",
                                                    "margin": "md"
                                                }
                                            ]
                                        }
                                    ],
                                    "spacing": "xl",
                                    "paddingAll": "20px"
                                }
                            ],
                            "paddingAll": "0px"
                        },
                        "footer": {
                            "type": "box",
                            "layout": "vertical",
                            "contents": [
                                {
                                    "type": "button",
                                    "action": {
                                        "type": "uri",
                                        "label": "คลิกเปิดใช้งานระบบ",
                                        "uri": "https://aicip-p3-app.onrender.com/"
                                    },
                                    "style": "primary",
                                    "color": "#0056FF"
                                }
                            ]
                        }
                    }
                };

                try {
                    const res = await liff.shareTargetPicker([flexMessage]);
                    if (res) {
                        liff.closeWindow(); // ส่งเสร็จแล้วปิดหน้าต่างทันที
                    }
                } catch (error) {
                    alert("เกิดข้อผิดพลาด หรือคุณกดยกเลิก");
                }
            }
        }
    </script>
</body>
</html>
